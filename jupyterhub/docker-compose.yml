# docker-compose.yml - JupyterHub deployment
services:
  jupyterhub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    container_name: jupyterhub
    ports:
      # 127.0.0.1 only: the hub is reachable from this PC, not from the network.
      # ("8000:8000" publishes on every interface: LAN, campus or cafe Wi-Fi.)
      - "127.0.0.1:8000:8000"
    volumes:
      # Mount the Docker socket so JupyterHub can spawn containers
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Persist JupyterHub's database (user accounts, server states)
      - ./jupyterhub-data:/srv/jupyterhub/data
    environment:
      # c.DockerSpawner.volumes requires an absolute path because the Docker daemon running on the host machine performs the actual bind mount, and it cannot resolve relative paths without a full file system reference. Also see ./config/jupyterhub_config.py
      - HOST_DEPLOY_DIR=${PWD}
      - HUB_AGENT_OWNER=jovyan
      # Put HUB_USER_PASSWORD=<at least 8 chars> in a .env file next to this
      # docker-compose.yml (gitignored), or export it before launch_tool.sh.
      - HUB_USER_PASSWORD=${HUB_USER_PASSWORD:?set HUB_USER_PASSWORD in .env}
    networks:
      - jupyterhub-network

    restart: unless-stopped

networks:
  jupyterhub-network:
    name: jupyterhub-network

